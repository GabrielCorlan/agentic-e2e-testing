name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Disclaimer - tests are not run in CI
        run: |
          echo "::notice::E2E tests are NOT executed by this workflow."
          echo "::notice::practicesoftwaretesting.com sits behind Cloudflare bot management, which blocks/challenges GitHub-hosted runner IPs essentially 100% of the time (see README's 'Known limitation' section) - for reasons unrelated to code changes, so running here would never pass."
          echo "::notice::Running it anyway would also waste CI minutes on a guaranteed failure and risks re-locking the shared TEST_USER account from repeated failed logins (this happened once already)."
          echo "::notice::Run the suite locally instead: npm test (see README's 'Running tests' section)."

